# 每個交易日自動抓資料並建表。cron 用 UTC（台灣時間減 8 小時）：
#   09:30 UTC = 台灣 17:30（主要時段，17:15 前資料通常已到齊）
#   11:30 UTC = 台灣 19:30（備援；沒有缺資料就什麼都不做）
# 2026-11-12：加入備援時段、逾時上限、失敗也記錄原因（data/fetch_log.csv）
# 2026-11-18：GitHub 的排程實際上常延遲 8 小時以上（台灣半夜才跑），而且舊版只抓「今天」，
#   某天失敗就永遠缺。改成每次都自動補齊最近 30 天缺的交易日，日期一律用台灣時間。
#   另加一個隔天早上的時段，當作再保險。
name: daily-cb-data
on:
  schedule:
    - cron: "30 9 * * 1-5"
    - cron: "30 11 * * 1-5"
    - cron: "0 0 * * 2-6"     # 台灣隔天 08:00：前一晚都沒跑成時補抓
  workflow_dispatch:
    inputs:
      day:
        description: "指定日期（例如 2026-10-27），留空 = 自動補齊最近 30 天缺的日子"
        required: false
        default: ""

concurrency:
  group: daily-cb-data   # 兩個時段不會同時跑
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 一次最多補 8 天，每天約 1.5 分鐘
    permissions:
      contents: write
    env:
      DAY: ${{ inputs.day }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 抓資料、建表（自動補齊最近 30 天缺的交易日）
        run: |
          if [ -n "$DAY" ]; then
            python backfill.py "$DAY"
          else
            python backfill.py --auto
          fi
      - name: 把結果（含失敗紀錄）存回 repo
        if: always()
        run: |
          git config user.name "cb-bot"
          git config user.email "cb-bot@users.noreply.github.com"
          git add data   # data/raw 已被 .gitignore 排除
          git commit -m "data: $(TZ=Asia/Taipei date +%F) 排程" || echo "沒有新資料"
          git pull --rebase --autostash || true
          git push
