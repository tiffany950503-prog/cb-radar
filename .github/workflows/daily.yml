# 每個交易日台灣時間 17:30 自動抓資料並建表（cron 用 UTC，台灣時間減 8 小時：09:30）
# 2026-10-22 用 check_ready.py 確認：17:15 時三個資料來源都已到齊，多留 15 分鐘緩衝
# 注意：GitHub 排程偶爾會延遲幾分鐘到幾十分鐘；國定假日沒有資料，fetch.py 會直接停止
name: daily-cb-data
on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}   # 也可以在 GitHub 頁面手動按執行

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest test_build.py
      - run: python fetch.py
      - run: python build.py
      - name: 把當天結果 commit 回 repo
        run: |
          git config user.name "cb-bot"
          git config user.email "cb-bot@users.noreply.github.com"
          git add data/daily_*.csv data/cb.db docs/data/latest.json docs/data/history.json
          git commit -m "data: $(date +%F)" || echo "沒有新資料"
          git push